<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>levertech</title>
    <meta name="description" content="Open hardware for human input." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <style>
      html { background: #000; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .home {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        background: #000;
      }
      /* The art is 83 units wide, so only whole-number scales keep the
         pixels square. Each width below is 83 x an integer, switched at the
         exact viewport width where that scale becomes the largest that fits
         within half the viewport, capped at 83 x 6 = 498px. */
      #art {
        display: block;
        width: 166px; /* 83 x 2 */
        height: auto;
      }
      @media (min-width: 498px) { #art { width: 249px; } } /* 83 x 3 */
      @media (min-width: 664px) { #art { width: 332px; } } /* 83 x 4 */
      @media (min-width: 830px) { #art { width: 415px; } } /* 83 x 5 */
      @media (min-width: 996px) { #art { width: 498px; } } /* 83 x 6 */
      .home:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -6px;
      }
    </style>
  </head>
  <body>
    <a class="home" href="https://github.com/lever-tech/flake" aria-label="lever flake on GitHub">
      <img id="art" src="lever-flake.svg" alt="" width="83" height="7" />
    </a>
  </body>
</html>
