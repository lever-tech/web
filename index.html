<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>levertech</title>
    <meta name="description" content="Open hardware for human input." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <style>
      html { background: #000; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .home {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        background: #000;
      }
      #art { display: block; height: auto; }
      .home:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -6px;
      }
    </style>
  </head>
  <body>
    <a class="home" href="https://github.com/lever-tech/flake" aria-label="lever flake on GitHub">
      <img id="art" src="lever-flake.svg" alt="" width="83" height="7" />
    </a>
    <noscript>
      <style>
        #art { width: 747px; max-width: 83vw; }
      </style>
    </noscript>
    <script>
      // Pixel art only looks right at whole-number scales, so round the
      // scale down to an integer and size the image in exact pixels.
      const ART_WIDTH = 83;
      const art = document.getElementById("art");

      function fit() {
        const margin = Math.max(16, Math.round(window.innerWidth * 0.05));
        const scale = Math.min(16, Math.floor((window.innerWidth - margin) / ART_WIDTH));
        art.style.width = Math.max(ART_WIDTH, scale * ART_WIDTH) + "px";
      }

      fit();
      addEventListener("resize", fit, { passive: true });
    </script>
  </body>
</html>
